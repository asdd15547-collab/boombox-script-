// ==========================================
// محرك التطبيق (App Engine)
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('scriptsGrid');
  const searchInput = document.getElementById('searchInput');
  const codeEditor = document.getElementById('codeEditor');
  const editorFileName = document.getElementById('editorFileName');
  const editorMeta = document.getElementById('editorMeta');
  const storageUsed = document.getElementById('storageUsed');
  const storageFill = document.getElementById('storageFill');
  
  let currentFilter = 'all';
  const MAX_MB = 50;

  // 1. حساب التخزين
  function updateStorage() {
    let totalBytes = 0;
    scriptsData.forEach(s => totalBytes += new Blob([s.code]).size);
    const usedMB = (totalBytes / (1024 * 1024)).toFixed(2);
    const pct = Math.min((totalBytes / (MAX_MB * 1024 * 1024)) * 100, 100);
    storageUsed.textContent = `${usedMB} MB / ${MAX_MB} MB`;
    storageFill.style.width = `${pct}%`;
    if (pct > 90) storageFill.classList.add('full');
  }

  // 2. تحديث العدادات
  function updateCounts() {
    const counts = { all: 0, utility: 0, movement: 0, combat: 0, other: 0 };
    scriptsData.forEach(s => counts[s.cat] = (counts[s.cat] || 0) + 1);
    counts.all = scriptsData.length;
    document.getElementById('countAll').textContent = counts.all;
    document.getElementById('countUtility').textContent = counts.utility;
    document.getElementById('countMovement').textContent = counts.movement;
    document.getElementById('countCombat').textContent = counts.combat;
    document.getElementById('countOther').textContent = counts.other;
  }

  // 3. عرض السكربتات
  function renderScripts(filter = 'all', query = '') {
    grid.innerHTML = '';
    const filtered = scriptsData.filter(s => {
      const matchCat = filter === 'all' || s.cat === filter;
      const matchQuery = s.name.toLowerCase().includes(query.toLowerCase());
      return matchCat && matchQuery;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty">📭 لا توجد نتائج مطابقة</div>';
      return;
    }

    filtered.forEach(s => {
      const card = document.createElement('div');
      card.className = 'script-card';
      card.innerHTML = `
        <h3>${s.name}</h3>
        <p>${s.desc || 'سكربت Lua جاهز للاستخدام'}</p>
        <footer><span>${s.cat.toUpperCase()}</span><span>👁️ عرض ونسخ</span></footer>
      `;
      card.addEventListener('click', () => {
        editorFileName.textContent = s.name.replace(/\s+/g, '_') + '.lua';
        codeEditor.value = s.code;
        updateMeta();
        showToast(`✅ تم تحميل: ${s.name}`);
      });
      grid.appendChild(card);
    });
  }

  // 4. وظائف المحرر
  function updateMeta() {
    const lines = codeEditor.value.split('\n').length;
    editorMeta.textContent = `${lines} سطر | ${codeEditor.value.length} حرف`;
  }

  document.getElementById('copyBtn').addEventListener('click', () => {
    if (!codeEditor.value) return;
    navigator.clipboard.writeText(codeEditor.value).then(() => showToast('✅ تم نسخ الكود بنجاح!'));
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    codeEditor.value = '';
    editorFileName.textContent = 'اختر سكربت من الأسفل';
    updateMeta();
  });

  // 5. البحث والفلترة
  searchInput.addEventListener('input', (e) => renderScripts(currentFilter, e.target.value));
  
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderScripts(currentFilter, searchInput.value);
    });
  });

  // 6. الإشعارات
  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
  }

  // التشغيل الأولي
  updateCounts();
  renderScripts();
  updateStorage();
  updateMeta();
});
</script>
</body>
</html>
